name: Lean and exact checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    env:
      LEAN_NUM_THREADS: 2
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: leanprover/lean-action@a2cd0b8fd34c304895595abb5f1cfb892e2b50d8
        with:
          auto-config: 'false'
          build: 'true'
          build-args: '--wfail'
          test: 'false'
          lint: 'false'
          use-mathlib-cache: 'true'
          leanchecker: 'true'
          leanchecker-args: 'LcmSix'
      - name: Axiom dependency report
        run: python3 scripts/check_axioms.py
      - name: Integral lattice certificate correspondence
        run: python3 scripts/export_lattice_certificates.py
      - name: Real duplication certificate correspondence
        run: python3 scripts/export_duplication_certificates.py
      - name: Actual numerical height certificate correspondence
        run: |
          python3 scripts/export_height_orbits.py --check
          python3 scripts/export_log_certificates.py
          python3 scripts/export_height_intervals.py
          python3 scripts/export_gram_certificates.py
      - name: Independent exact-arithmetic sanity checks
        run: python3 scripts/verify_reduction.py
      - name: Exact rational height certificates
        run: python3 scripts/verify_heights.py
      - name: Global analytic and exact arithmetic certificates
        run: python3 scripts/verify_global_bound.py
      - name: Independent saturation and minimum-height certificates
        run: python3 cas/saturation/verify_all.py
      - name: Independent descent and rank certificates
        run: python3 cas/descent/verify_all.py
      - name: Exact cubic transport obstruction witnesses
        run: |
          python3 cas/uniform/cubic_obstruction_certificate.py
          python3 cas/uniform/verify_cubic_discriminants.py
